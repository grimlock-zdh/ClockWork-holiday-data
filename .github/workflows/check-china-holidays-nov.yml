name: 11 月中国节假日每日检查

on:
  schedule:
    # 北京时间 11 月每天 08:00、20:00。GitHub 定时任务可能有少量排队延迟。
    - cron: '0 0,12 * 11 *'
  workflow_dispatch:

jobs:
  check-china:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 检查国务院节假日通知
        run: python3 fetch_holiday_china.py --index-only

      - name: 仅在有真实数据变化时提交
        run: |
          if git diff --quiet -- holiday-data-china.json; then
            echo "中国节假日数据无变化"
            exit 0
          fi
          git config user.name "holiday-bot"
          git config user.email "holiday-bot@users.noreply.github.com"
          git add holiday-data-china.json
          git commit -m "auto: 更新中国节假日数据（$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')）"
          git push
