name: 自动更新节假日数据（6 国官方源）

on:
  schedule:
    # 每周一早上 8:00（北京时间）检查一次
    - cron: '0 0 * * 1'
  # 也可以手动触发
  workflow_dispatch:

jobs:
  fetch-holidays:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 爬取中国（国务院）
        run: python3 fetch_holiday.py

      - name: 爬取日本（内閣府）
        run: python3 fetch_holiday_japan.py

      - name: 爬取美国（OPM）
        run: python3 fetch_holiday_usa.py

      - name: 爬取英国（GOV.UK）
        run: python3 fetch_holiday_uk.py

      - name: 爬取法国（data.gouv）
        run: python3 fetch_holiday_france.py

      - name: 爬取德国（法定规则 + Berlin 官方核对）
        run: python3 fetch_holiday_germany.py
      
      - name: 检查是否有更新
        id: check
        run: |
          if git diff --quiet -- 'holiday-data-*.json'; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "无变化，跳过提交"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: 提交更新（如果有变化）
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "holiday-bot"
          git config user.email "holiday-bot@users.noreply.github.com"
          git add 'holiday-data-*.json'
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M')
          git commit -m "auto: 更新节假日数据（$TIMESTAMP）"
          git push
